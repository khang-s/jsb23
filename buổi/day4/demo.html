<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .menu {
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 50px;
            padding-right: 50px;
            background-color: grey;
        }

        .logo {
            font-size: 25px;
            padding: 20px;
            font-weight: bold;
        }

        .logo:hover {
            background-color: antiquewhite;
            cursor: pointer;
        }

        .menu-items {
            display: flex;
        }

        .items {
            padding: 25px;
            font-size: 25px;
            font-weight: bold;
        }

        .items:hover {
            background-color: brown;
            cursor: pointer;
            ;
        }
    </style>
    
  </head>
  <body>
    
    <div class="menu">
      <div class="logo">Logo</div>

      <div class="menu-items">
        <div class="items">Trang chủ</div>
        <div class="items">Sản phẩm</div>
        <div class="items">Liên hệ</div>
        <div class="items">Giỏ hàng</div>
      </div>
    </div>
  </body>
</html>
